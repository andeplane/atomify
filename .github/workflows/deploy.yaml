name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      # npm ci must come before the JupyterLite build: `make jupyter`
      # copies node_modules/lammps.js/dist into public/jupyter/lammps.
      # (make jupyter also applies the COOP/COEP service-worker patch via
      # scripts/jupyter_coi_patch.py.)
      - name: Install Packages
        run: npm ci
      - name: Check lammps.js wheel version
        run: node scripts/check_lammps_versions.mjs
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check starter notebook template
        run: python scripts/check_notebook_template.py
      - name: Build JupyterLite site
        run: make jupyter
      - name: Run Typecheck
        run: npm run typecheck
      - name: Run Tests
        run: npm run test:run
      - name: Run Prettier
        run: npx prettier --check .
      - name: Run ESLint
        run: npm run lint
      - name: Build app
        run: npm run build
      # The Help site (help/, VitePress) has its own package.json so its
      # dependencies stay out of the app's lockfile. It builds into
      # dist/help, i.e. it is published at /atomify/help/ next to the app.
      - name: Install Help site packages
        run: npm ci --prefix help
      - name: Build Help site
        run: npm run build --prefix help
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
