name: E2E smoke

# A Chromium smoke subset of the Playwright suite (tests tagged @smoke, see
# playwright.smoke.config.ts) against the production build served by
# `vite preview`. The full suite stays a local `npm run e2e`.

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
      - name: Install Packages
        run: npm ci
      - name: Get Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Always run: on a cache hit this skips the download but still installs
      # the system libraries Chromium needs, which the cache does not hold.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      # The notebook smoke test needs the JupyterLite site, which the build
      # copies from public/jupyter into dist (same steps as deploy.yaml).
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jupyterlite/requirements.txt
      - name: Build JupyterLite site
        run: make jupyter
      - name: Build app
        run: npm run build
      - name: Run e2e smoke suite
        run: npm run e2e:smoke
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
